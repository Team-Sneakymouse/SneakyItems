name: SneakyItems
version: '${version}'
main: com.sneakyitems.SneakyItems
description: SneakyItems for Team-Sneakymouse / Lords of Minecraft.
api-version: '26.2'
authors: [Team Sneakymouse]
website: https://github.com/Team-Sneakymouse/SneakyItems
dependencies:
  server:
    SneakyUtils:
      load: BEFORE
      required: true
      join-classpath: true
    # Soft runtime only (inventory/character hooks). Do not loadafter SCM/Vaults —
    # SCM requires SneakyItems BEFORE it, which would cycle: Items → Vaults → SCM → Items.
permissions:
  sneakyitems.command.reload:
    description: Reload the plugin configuration.
    default: op
  sneakyitems.nosoulbound:
    description: Bypass soulbound restrictions while in Creative mode.
    default: false
