name: SneakyItems
version: '${version}'
main: com.sneakyitems.SneakyItems
description: SneakyItems for Team-Sneakymouse / Lords of Minecraft.
api-version: '26.2'
authors: [Team Sneakymouse]
website: https://github.com/Team-Sneakymouse/SneakyItems
dependencies:
  server:
    SneakyUtils:
      load: BEFORE
      required: true
      join-classpath: true
    # Optional: measurements only (integration/Probe.java). join-classpath lets the probe see its API.
    SneakyDiagnostics:
      load: BEFORE
      required: false
      join-classpath: true
    # Classpath only, so the character hooks can see SCM types (LoadCharacterEvent).
    # load: OMIT on purpose. SCM loads SneakyItems BEFORE itself, so any ordering
    # here would cycle (Items → Vaults → SCM → Items). The hooks register on PluginEnableEvent.
    SneakyCharacterManager:
      load: OMIT
      required: false
      join-classpath: true
permissions:
  sneakyitems.command.reload:
    description: Reload the plugin configuration.
    default: op
  sneakyitems.command.legacy-tags:
    description: Toggle legacy item-tag mappings in memory (does not edit config).
    default: op
  sneakyitems.nosoulbound:
    description: Bypass soulbound restrictions while in Creative mode.
    default: false
